<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tittanium · Publicaciones</title>
<style>
  :root{--green:#2e7d32;--green2:#57c96a;--ink:#16341c;--muted:#5f6e68;--hero:#0d2b16}
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Roboto,Arial,sans-serif}
  body{background:#eef6f0;color:var(--ink);min-height:100vh}
  main{max-width:860px;margin:0 auto;padding:60px 24px}
  .bar{background:var(--hero);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:10px}
  .bar b{letter-spacing:.14em;font-size:15px}
  h1{font-size:34px;margin-bottom:8px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin-bottom:30px;font-size:16px}
  a.card{display:block;background:#fff;border:1px solid #d9e8dc;border-radius:16px;padding:20px 24px;text-decoration:none;color:inherit;margin-bottom:14px;transition:box-shadow .15s ease}
  a.card:hover{box-shadow:0 10px 26px rgba(15,26,18,.12)}
  a.card b{color:var(--green);font-size:18px}
  a.card p{color:var(--muted);font-size:14px;margin-top:5px}
  .tag{display:inline-block;background:var(--green);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.05em;margin-right:8px;text-transform:uppercase}
</style></head>
<body>
  <div class="bar"><b>TITTANIUM</b>&nbsp;<span style="opacity:.7">/ publicaciones</span></div>
  <main>
    <h1>Publicaciones · escroll world</h1>
    <p class="sub">Animatelas en scroll, listas para publicar en redes.</p>
    <a class="card" href="cloud-01/">
      <span class="tag">Cloud · 01</span><b>7 formas de reducir el costo de Azure sin perder rendimiento</b>
      <p>Publicación de ahorro en Azure: redimensiona, reserva, escala, optimiza storage y más. 🌩️💚</p>
    </a>
  </main>
</body></html>
